name: dots_pdf
description: >-
  JSON-templated PDF generation for Flutter. Renders the document as a single
  PDF or as 2-page-pair PDFs, persists artifacts on disk with typed path
  accessors, supports on-demand re-generation, and is optimized for low-end
  mobile devices (one-page-at-a-time pipeline, eager resource disposal).
version: 0.1.1
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.1
  barcode: ^2.2.9
  file: ^7.0.1
  path: ^1.9.0
  meta: ^1.16.0
  image: ^4.8.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  assets:
    - assets/FOGRA99.txt
    - assets/fonts/p22_mackinac/P22Mackinac-Medium_6.ttf
    - assets/fonts/p22_mackinac/P22Mackinac-Book_13.ttf
    - assets/fonts/p22_mackinac/P22Mackinac-MedItalic_22.ttf
    - assets/fonts/inter/Inter-VariableFont_opsz,wght.ttf
    - assets/fonts/inter/Inter-Italic-VariableFont_opsz,wght.ttf
    - assets/fonts/biro_plus/Biro-ScriptPlus-Regular-subset.ttf
